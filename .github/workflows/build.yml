# openSYDE CI — Build & Test
#
# Builds the opensyde_core library, runs its unit tests, and smoke-builds all
# eight tools on Ubuntu with Qt6.
#
# Runner target: resolute (26.04 LTS), the distro this fork develops against.
#
# Older releases are deliberately NOT targeted. Package names diverge across
# them — jammy (22.04) calls the Qt6 SVG development package libqt6svg6-dev,
# whereas noble (24.04) onward call it qt6-svg-dev — so supporting a range
# would mean per-release package selection for no benefit to a fork that only
# ships against one distro.
#
# Both jobs build with resolute's default g++ (GCC 15). Nothing is pinned: the
# core job previously pinned g++-12 and g++-13, inherited from a Phase 0 matrix
# that targeted jammy and noble, so it was compiling core with two versions
# nobody ships while build.sh built the tools with the default. Core and the
# GUI tools now agree on one compiler, and it is the one resolute users get.
#
# ubuntu-26.04 is still a preview runner image. It is NOT marked
# continue-on-error: as the only target it has to gate, or CI stops meaning
# anything. The tradeoff is that preview-image flakiness will show up as a red
# build; if that becomes noisy, add a second GA runner back rather than
# reinstating continue-on-error.

name: Build & Test

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch: # allow manual trigger

env:
  BUILD_TYPE: Debug

jobs:
  core-library:
    name: Core Library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # flex and bison generate the Vector_DBC scanner/parser, and opensyde_core
      # links CanLibraries::dbc, so they are required for configure to succeed.
      # FlexLexer.h ships in libfl-dev, NOT in flex itself — without libfl-dev
      # CMake leaves FLEX_INCLUDE_DIR unset and Vector_DBC fails to generate.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build g++ \
            qt6-base-dev \
            libgl1-mesa-dev \
            libssl-dev \
            flex bison libfl-dev

      # Compile every subsystem (security, protocol drivers, zipping,
      # imports, code generation, project handling, param set, system package
      # handling, x-config/-certificates generation, logging) so untested
      # code cannot rot unnoticed. Only the Windows-only subsystems are
      # skipped (they cannot build on the Ubuntu runner).
      - name: Configure CMake (core library tests, full coverage)
        run: >
          cmake
          -S libraries/opensyde_core
          -B build/core
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DOPENSYDE_CORE_BUILD_TESTS=ON
          -DOPENSYDE_CORE_SKIP_WINDOWS_DRIVERS=ON
          -DOPENSYDE_CORE_SKIP_WINDOWS_TARGET=ON

      - name: Build
        run: cmake --build build/core -j $(nproc)

      - name: Run unit tests
        run: ctest --test-dir build/core --output-on-failure -j $(nproc)

  gui-tools:
    name: GUI Tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # build.sh requires plain `g++` (it never pins a version), so install the
      # default metapackage rather than a numbered compiler. libssl-dev, flex,
      # bison and libfl-dev are needed for the same reasons as the core job.
      #
      # libqcustomplot-dev is required by the openSYDE tool: on Linux it links
      # the system QCustomPlot (libraries/qcustomplot/ holds only a
      # QT_NO_KEYWORDS compatibility wrapper around the system header, not a
      # vendored library). The package ships libQCustomPlotQt6.so, which is the
      # Qt6 variant the project's find_library() call looks for.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build g++ ccache \
            qt6-base-dev qt6-svg-dev qt6-tools-dev \
            libgl1-mesa-dev \
            libssl-dev \
            flex bison libfl-dev \
            libqcustomplot-dev

      # build.sh configures each of the eight tools separately, so opensyde_core
      # is compiled once per tool. build.sh picks up ccache automatically when it
      # is installed, which turns the repeated core builds into cache hits — the
      # win lands even on a cold cache, since tools 2-8 hit what tool 1 wrote.
      # Persisting the cache across runs makes incremental pushes cheaper still.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-gui-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ccache-gui-${{ matrix.os }}-

      - name: Build all tools (smoke test)
        run: ./build.sh -b Debug all

      - name: ccache statistics
        if: always()
        run: ccache --show-stats
