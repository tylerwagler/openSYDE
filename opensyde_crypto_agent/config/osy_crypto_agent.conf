# Port to be used by the openSYDE Crypto Agent TCP Server (default: 50963)
OSY_CRYPTO_AGENT_TCP_SERVER_PORT=50963

# Bind address for the OSY Crypto Agent TCP Server (default: 127.0.0.1 = localhost)
# If opening this to the network, make sure to use a firewall and only allow trusted
#  hosts to connect to this port, as the openSYDE Crypto Agent does not implement any
#  authentication or encryption on its own.
OSY_CRYPTO_AGENT_TCP_SERVER_BIND_ADDRESS=127.0.0.1

# Folder for log files created by the openSYDE Crypto Agent (default: ./logs)
# Log file will be overwritten on each start of the openSYDE Crypto Agent.
OSY_CRYPTO_AGENT_LOG_FILE_FOLDER=./logs

# Folder for PEM files used by the openSYDE Crypto Agent (default: ./certificates)
# This is relative to the Crypto Agent's own directory (the daemon chdirs there on
# start), so it resolves to <install>/tool/certificates.
OSY_CRYPTO_AGENT_AUTH_PEM_FILE_FOLDER=../../tool/certificates

# Verbosity level for writing information to stdout
# full (default): full information
# low: only name + version; info that there will be a log file; parameter parsing warnings and hard errors
OSY_CRYPTO_AGENT_STDOUT_VERBOSITY_LEVEL=low
